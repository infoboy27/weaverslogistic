# Behind an existing Traefik (server 163: loadbalancer-traefik on winu-bot-signal-network).
# Secrets live on the host only: .env (0600) and secrets/users.txt (0640). See IMPLEMENTACION_PRODUCCION.md.
#   docker compose -f docker-compose.traefik.yml up -d --build
name: weaverslogistic
services:
  app:
    build: .
    image: weaverslogistic-app
    container_name: weaverslogistic-app
    restart: unless-stopped
    user: "1000:1000"
    environment:
      WEAVERS_AUTH_MODE: password
      WEAVERS_USERS_FILE: /run/secrets/weavers_users
      WEAVERS_SESSION_SECRET: ${WEAVERS_SESSION_SECRET:?required}
      SP_API_LWA_CLIENT_ID: ${SP_API_LWA_CLIENT_ID:-}
      SP_API_LWA_CLIENT_SECRET: ${SP_API_LWA_CLIENT_SECRET:-}
      SP_API_REFRESH_TOKEN: ${SP_API_REFRESH_TOKEN:-}
      SP_API_SELLER_ID: ${SP_API_SELLER_ID:-}
      KEEPA_API_KEY: ${KEEPA_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://weavers:${POSTGRES_PASSWORD:?required}@db:5432/weavers
    volumes:
      - ./data:/app/data
      - ./secrets/users.txt:/run/secrets/weavers_users:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [default, proxy]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp", "/home/appuser:uid=1000,gid=1000,mode=0700"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: winu-bot-signal-network
      traefik.http.routers.weavers-fba.rule: Host(`${APP_DOMAIN:?required}`)
      traefik.http.routers.weavers-fba.entrypoints: websecure
      traefik.http.routers.weavers-fba.tls: "true"
      traefik.http.routers.weavers-fba.tls.certresolver: letsencrypt
      traefik.http.routers.weavers-fba.middlewares: weavers-fba-headers,weavers-fba-ratelimit
      traefik.http.services.weavers-fba.loadbalancer.server.port: "8501"
      traefik.http.middlewares.weavers-fba-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.weavers-fba-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.weavers-fba-headers.headers.frameDeny: "true"
      traefik.http.middlewares.weavers-fba-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.weavers-fba-headers.headers.customResponseHeaders.X-Robots-Tag: noindex, nofollow
      traefik.http.middlewares.weavers-fba-headers.headers.customResponseHeaders.Server: ""
      traefik.http.middlewares.weavers-fba-ratelimit.ratelimit.average: "50"
      traefik.http.middlewares.weavers-fba-ratelimit.ratelimit.burst: "200"
      traefik.http.middlewares.weavers-fba-ratelimit.ratelimit.sourcecriterion.requestheadername: Cf-Connecting-Ip

  db:
    image: postgres:17-alpine
    container_name: weaverslogistic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: weavers
      POSTGRES_USER: weavers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [default]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weavers -d weavers"]
      interval: 10s
      retries: 10

networks:
  proxy:
    name: winu-bot-signal-network
    external: true

volumes:
  postgres_data:
