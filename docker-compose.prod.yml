# Deploy behind HTTPS using Caddy. Supply secrets via .env on the host (0600).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      WEAVERS_AUTH_MODE: required
      WEAVERS_ALLOWED_EMAILS: ${WEAVERS_ALLOWED_EMAILS:?required}
      SP_API_LWA_CLIENT_ID: ${SP_API_LWA_CLIENT_ID:-}
      SP_API_LWA_CLIENT_SECRET: ${SP_API_LWA_CLIENT_SECRET:-}
      SP_API_REFRESH_TOKEN: ${SP_API_REFRESH_TOKEN:-}
      KEEPA_API_KEY: ${KEEPA_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://weavers:${POSTGRES_PASSWORD:?required}@db:5432/weavers
    volumes:
      - ./data:/app/data
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    expose:
      - "8501"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weavers
      POSTGRES_USER: weavers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U weavers -d weavers"]
      interval: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
